name: WhatsApp Automation

on:
  schedule:
    - cron: '0 3 * * *'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  run:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          persist-credentials: true
          fetch-depth: 0

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install Chromium dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            chromium-browser \
            libgbm-dev

      - name: Install dependencies
        run: npm install

      # إنشاء مجلد session إذا لم يكن موجود
      - name: Ensure session directory
        run: |
          mkdir -p session

      # حذف جميع ملفات Lock
      - name: Remove Chromium lock files
        run: |
          find session -name "SingletonLock" -delete 2>/dev/null || true
          find session -name "SingletonSocket" -delete 2>/dev/null || true
          find session -name "SingletonCookie" -delete 2>/dev/null || true
          find session -name "DevToolsActivePort" -delete 2>/dev/null || true
          find session -name "*.lock" -delete 2>/dev/null || true

      - name: Run WhatsApp Bot
        env:
          PUPPETEER_EXECUTABLE_PATH: /usr/bin/chromium-browser
          WORKER_URL: ${{ secrets.WORKER_URL }}
          API_SECRET: ${{ secrets.API_SECRET }}
        run: npm start

      # تنظيف الملفات غير المهمة قبل الحفظ
      - name: Clean Chromium cache
        if: always()
        run: |
          find session -type d -name "Cache" -exec rm -rf {} + 2>/dev/null || true
          find session -type d -name "Code Cache" -exec rm -rf {} + 2>/dev/null || true
          find session -type d -name "GPUCache" -exec rm -rf {} + 2>/dev/null || true
          find session -type d -name "Crashpad" -exec rm -rf {} + 2>/dev/null || true
          find session -type d -name "GrShaderCache" -exec rm -rf {} + 2>/dev/null || true
          find session -type d -name "GraphiteDawnCache" -exec rm -rf {} + 2>/dev/null || true
          find session -type d -name "ShaderCache" -exec rm -rf {} + 2>/dev/null || true
          find session -type d -name "BrowserMetrics" -exec rm -rf {} + 2>/dev/null || true
          find session -type d -name "DawnCache" -exec rm -rf {} + 2>/dev/null || true
          find session -type d -name "Service Worker/CacheStorage" -exec rm -rf {} + 2>/dev/null || true

      - name: Show session size
        if: always()
        run: |
          du -sh session || true

      - name: Commit updated files
        if: always()
        run: |
          git config user.name "github-actions"
          git config user.email "github-actions@github.com"

          git add dashboard aggregate.json logs

          git commit -m "Update dashboard $(date +'%Y-%m-%d %H:%M')" || echo "No changes"

          git push
