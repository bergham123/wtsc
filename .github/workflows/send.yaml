name: WhatsApp Automation

on:
  schedule:
    - cron: "0 3 * * *"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  run:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          persist-credentials: true
          fetch-depth: 0

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - name: Restore session cache
        id: restore-cache
        uses: actions/cache/restore@v4
        with:
          path: session
          key: session-${{ github.run_id }}
          restore-keys: session-

      - name: Ensure session directory
        run: mkdir -p session

      - name: Remove Chromium locks
        run: |
          find session -name "SingletonLock" -delete || true
          find session -name "SingletonSocket" -delete || true
          find session -name "SingletonCookie" -delete || true
          find session -name "*.lock" -delete || true
          find session -name "DevToolsActivePort" -delete || true

      - name: Install system packages
        run: |
          sudo apt-get update
          sudo apt-get install -y chromium-browser libgbm-dev

      - name: Install dependencies
        run: npm ci

      - name: Run Bot
        env:
          PUPPETEER_EXECUTABLE_PATH: /usr/bin/chromium-browser
          WORKER_URL: ${{ secrets.WORKER_URL }}
          API_SECRET: ${{ secrets.API_SECRET }}
        run: node index.js

      - name: Clean Chromium cache
        if: always()
        run: |
          rm -rf session/**/Cache || true
          rm -rf session/**/"Code Cache" || true
          rm -rf session/**/GPUCache || true
          rm -rf session/**/Crashpad || true
          rm -rf session/**/BrowserMetrics || true
          rm -rf session/**/GrShaderCache || true
          rm -rf session/**/GraphiteDawnCache || true
          rm -rf session/**/ShaderCache || true
          rm -rf session/**/DawnCache || true

      - name: Check session validity
        id: check-session
        if: always()
        run: |
          if [ -d "session/main/IndexedDB" ] || [ -d "session/main/Local Storage" ]; then
            echo "exists=true" >> $GITHUB_OUTPUT
          else
            echo "exists=false" >> $GITHUB_OUTPUT
          fi

      - name: Save session cache
        if: always() && steps.check-session.outputs.exists == 'true'
        uses: actions/cache/save@v4
        with:
          path: session
          key: session-${{ github.run_id }}

      - name: Compress session
        if: always()
        run: |
          tar -czf session.tar.gz session

      - name: Upload session artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: whatsapp-session
          path: session.tar.gz
          retention-days: 30

      - name: Commit dashboard/logs
        if: always()
        run: |
          git config user.name github-actions
          git config user.email github-actions@github.com
          git add dashboard aggregate.json logs
          git commit -m "Update $(date '+%F %T')" || true
          git push
