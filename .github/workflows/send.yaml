name: WhatsApp Automation

on:
  schedule:
    - cron: '0 8 * * *'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  run:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Setup Node.js 24
        uses: actions/setup-node@v4
        with:
          node-version: 24

      # ===== استعادة الجلسة من الكاش =====
      - name: Restore session from cache
        id: restore-session
        uses: actions/cache/restore@v4
        with:
          path: session
          key: whatsapp-session-${{ runner.os }}-${{ github.run_id }}-${{ github.run_attempt }}
          restore-keys: |
            whatsapp-session-${{ runner.os }}-
            whatsapp-session-

      - name: Ensure session directory
        run: mkdir -p session

      - name: Report restored session
        run: |
          if [ -d "session/session-main/Default/IndexedDB" ] || [ -d "session/session-main/Default/Local Storage" ]; then
            echo "✅ Restored WhatsApp session from cache"
          else
            echo "ℹ️ No reusable WhatsApp session found; QR scan may be required"
          fi

      - name: Remove Chromium locks
        run: |
          find session -name "SingletonLock" -delete 2>/dev/null || true
          find session -name "SingletonSocket" -delete 2>/dev/null || true
          find session -name "SingletonCookie" -delete 2>/dev/null || true
          find session -name "*.lock" -delete 2>/dev/null || true
          find session -name "DevToolsActivePort" -delete 2>/dev/null || true

      - name: Install system Chromium
        run: sudo apt-get update && sudo apt-get install -y chromium-browser

      - name: Install dependencies
        run: npm install --legacy-peer-deps
        env:
          PUPPETEER_SKIP_DOWNLOAD: "true"

      # ===== تشغيل البوت =====
      - name: Run WhatsApp bot
        env:
          WORKER_URL: ${{ secrets.WORKER_URL }}
          API_SECRET: ${{ secrets.API_SECRET }}
        run: node index.js

      # ===== تنظيف الملفات المؤقتة =====
      - name: Clean temporary Chromium files
        if: always()
        run: |
          rm -rf session/*/Cache 2>/dev/null || true
          rm -rf session/*/"Code Cache" 2>/dev/null || true
          rm -rf session/*/GPUCache 2>/dev/null || true
          rm -rf session/*/Crashpad 2>/dev/null || true
          rm -rf session/*/BrowserMetrics 2>/dev/null || true
          rm -rf session/*/GrShaderCache 2>/dev/null || true
          rm -rf session/*/GraphiteDawnCache 2>/dev/null || true
          rm -rf session/*/ShaderCache 2>/dev/null || true
          rm -rf session/*/DawnCache 2>/dev/null || true

      # ===== التحقق من صلاحية الجلسة لحفظ الكاش =====
      - name: Check session validity
        id: check-session
        if: always()
        run: |
          if [ -d "session/session-main/Default/IndexedDB" ] || [ -d "session/session-main/Default/Local Storage" ]; then
            echo "exists=true" >> $GITHUB_OUTPUT
            echo "✅ Valid WhatsApp profile found; saving cache"
          else
            echo "exists=false" >> $GITHUB_OUTPUT
            echo "⚠️ No valid WhatsApp profile found; cache will not be updated"
          fi

      - name: Save session cache
        if: always() && steps.check-session.outputs.exists == 'true'
        uses: actions/cache/save@v4
        with:
          path: session
          key: whatsapp-session-${{ runner.os }}-${{ github.run_id }}-${{ github.run_attempt }}

      # ===== (اختياري) رفع الـ Artifacts للاطلاع =====
      - name: Upload logs (artifact)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: bot-logs-${{ github.run_id }}
          path: logs/
          retention-days: 7
          if-no-files-found: ignore

      - name: Upload dashboard snapshot (artifact)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: dashboard-${{ github.run_id }}
          path: dashboard/
          retention-days: 7
          if-no-files-found: ignore

      # ===== دفع الملفات إلى المستودع =====
      - name: Commit and push logs, dashboard, and aggregate
        if: always()
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add logs/ dashboard/ aggregate.json || true
          if git diff --staged --quiet; then
            echo "📭 No changes to commit"
          else
            git commit -m "Update logs, dashboard, and aggregate [skip ci]"
            git push
            echo "✅ Changes pushed to repository"
          fi
