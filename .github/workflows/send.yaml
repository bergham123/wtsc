name: WhatsApp Automation

on:
  schedule:
    - cron: '0 8 * * *'
  workflow_dispatch:

permissions:
  contents: write
  actions: write # صلاحية حذف الكاشات القديمة

# منع تشغيل نسختين من نفس السكربت في نفس الوقت
concurrency:
  group: whatsapp-bot-run
  cancel-in-progress: false

jobs:
  run:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      # ===== استعادة الجلسة من الكاش =====
      - name: Restore session from cache
        id: restore-session
        uses: actions/cache/restore@v4
        with:
          path: session
          key: whatsapp-session-${{ runner.os }}-${{ github.run_id }}-${{ github.run_attempt }}
          restore-keys: |
            whatsapp-session-${{ runner.os }}-
            whatsapp-session-

      - name: Ensure directories exist
        run: mkdir -p session data logs dashboard

      - name: Remove Chromium locks
        run: |
          find session -name "SingletonLock" -delete 2>/dev/null || true
          find session -name "SingletonSocket" -delete 2>/dev/null || true
          find session -name "SingletonCookie" -delete 2>/dev/null || true
          find session -name "DevToolsActivePort" -delete 2>/dev/null || true

      # ===== بناء الـ Docker Image =====
      - name: Build Docker Image
        run: docker build -t wa-bot .

      # ===== تشغيل البوت داخل Docker =====
      - name: Run WhatsApp bot in Docker
        env:
          WORKER_URL: ${{ secrets.WORKER_URL }}
          API_SECRET: ${{ secrets.API_SECRET }}
        run: |
          docker run --rm \
            -v $(pwd)/session:/app/session \
            -v $(pwd)/data:/app/data \
            -v $(pwd)/logs:/app/logs \
            -v $(pwd)/dashboard:/app/dashboard \
            -e WORKER_URL="$WORKER_URL" \
            -e API_SECRET="$API_SECRET" \
            wa-bot

      # ===== إصلاح صلاحيات الملفات بعد خروج Docker =====
      - name: Fix permissions for caching
        if: always()
        run: sudo chown -R $USER:$USER session data logs dashboard || true

      # ===== تنظيف الكاش المؤقت فقط (بدون المساس بالجلسة) =====
      - name: Clean temporary Chromium files (Safe)
        if: always()
        run: |
          echo "🧹 Cleaning safe cache files (preserving session)..."
          rm -rf session/*/Cache 2>/dev/null || true
          rm -rf session/*/"Code Cache" 2>/dev/null || true
          rm -rf session/*/GPUCache 2>/dev/null || true
          rm -rf session/*/Crashpad 2>/dev/null || true
          rm -rf session/*/BrowserMetrics 2>/dev/null || true
          rm -rf session/*/GrShaderCache 2>/dev/null || true
          rm -rf session/*/GraphiteDawnCache 2>/dev/null || true
          rm -rf session/*/ShaderCache 2>/dev/null || true
          rm -rf session/*/DawnCache 2>/dev/null || true
          rm -rf session/*/DawnGraphiteCache 2>/dev/null || true
          rm -rf session/*/DawnWebGPUCache 2>/dev/null || true
          rm -rf session/*/GPUPersistentCache 2>/dev/null || true
          rm -rf session/*/Sessions 2>/dev/null || true
          rm -rf session/*/blob_storage 2>/dev/null || true
          
          # حذف الكاش المؤقت لـ Service Worker (بدون حذف قاعدة البيانات)
          rm -rf session/*/Default/"Service Worker"/CacheStorage 2>/dev/null || true
          rm -rf session/*/Default/"Service Worker"/ScriptCache 2>/dev/null || true
          
          echo "✅ Safe cleaning completed."

      # ===== التحقق من صلاحية الجلسة لحفظ الكاش =====
      - name: Check session validity
        id: check-session
        if: always()
        run: |
          if [ -d "session/session-main/Default/IndexedDB" ] || [ -d "session/session-main/Default/Local Storage" ]; then
            echo "exists=true" >> $GITHUB_OUTPUT
            echo "✅ Valid WhatsApp profile found; saving cache"
          else
            echo "exists=false" >> $GITHUB_OUTPUT
            echo "⚠️ No valid WhatsApp profile found; cache will not be updated"
          fi

      - name: Save session cache
        if: always() && steps.check-session.outputs.exists == 'true'
        uses: actions/cache/save@v4
        with:
          path: session
          key: whatsapp-session-${{ runner.os }}-${{ github.run_id }}-${{ github.run_attempt }}

      # ===== تنظيف الكاشات القديمة تلقائياً لتوفير المساحة =====
      - name: Cleanup old session caches
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          CURRENT_KEY="whatsapp-session-${{ runner.os }}-${{ github.run_id }}-${{ github.run_attempt }}"
          echo "Current cache key: $CURRENT_KEY"
          
          # جلب جميع IDs الكاشات التي تبدأ بـ whatsapp-session- باستثناء الكاش الحالي
          IDS=$(gh cache list --repo ${{ github.repository }} --json id,key --jq ".[] | select((.key | startswith(\"whatsapp-session-\")) and .key != \"$CURRENT_KEY\") | .id")
          
          if [ -z "$IDS" ]; then
            echo "✅ No old caches to delete."
          else
            for id in $IDS; do
              echo "🗑️ Deleting old cache ID: $id"
              gh cache delete "$id" --repo ${{ github.repository }} || true
            done
            echo "✅ Old caches cleaned up."
          fi

      # ===== رفع الـ Artifacts للاطلاع =====
      - name: Upload logs (artifact)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: bot-logs-${{ github.run_id }}
          path: logs/
          retention-days: 7
          if-no-files-found: ignore

      - name: Upload dashboard snapshot (artifact)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: dashboard-${{ github.run_id }}
          path: dashboard/
          retention-days: 7
          if-no-files-found: ignore

      # ===== دفع الملفات إلى المستودع =====
      - name: Commit and push logs, dashboard, and aggregate
        if: always()
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add logs/ dashboard/ data/aggregate.json || true
          if git diff --staged --quiet; then
            echo "📭 No changes to commit"
          else
            git commit -m "Update logs, dashboard, and aggregate [skip ci]"
            git push
            echo "✅ Changes pushed to repository"
          fi
