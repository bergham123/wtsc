name: WhatsApp Automation

on:
  schedule:
    - cron: '0 3 * * *'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  run:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repo
        uses: actions/checkout@v4
        with:
          persist-credentials: true

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y libgbm-dev

      - name: Install Node dependencies
        run: npm install

      # إزالة ملفات القفل القديمة لتجنب مشاكل الجلسة
      - name: Remove stale lock files
        run: |
          find session -name "SingletonLock" -delete 2>/dev/null || true
          find session -name "SingletonCookie" -delete 2>/dev/null || true
          find session -name "SingletonSocket" -delete 2>/dev/null || true
          find session -name "*.lock" -delete 2>/dev/null || true

      - name: Run WhatsApp bot
        env:
          PUPPETEER_EXECUTABLE_PATH: /usr/bin/chromium-browser
          WORKER_URL: ${{ secrets.WORKER_URL }}
          API_SECRET: ${{ secrets.API_SECRET }}
        run: npm start
        continue-on-error: true   # استمر حتى لو فشل البوت (لحفظ الملفات)

      - name: Commit updated files
        run: |
          git config user.name "github-actions"
          git config user.email "github-actions@github.com"
          # إضافة جميع الملفات المهمة (بما فيها session) - استخدم -f لتجاوز .gitignore إذا لزم الأمر
          git add -f dashboard aggregate.json logs session || true
          git commit -m "update session, dashboard & logs $(date +'%Y-%m-%d %H:%M')" || echo "No changes to commit"
          git push
