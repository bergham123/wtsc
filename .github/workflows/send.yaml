# .github/workflows/send.yaml
name: WhatsApp Automation

on:
  schedule:
    - cron: "30 3 * * *"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: whatsapp-bot
  cancel-in-progress: false

jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          persist-credentials: true

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libgbm-dev \
            libnss3 \
            libatk-bridge2.0-0 \
            libgtk-3-0 \
            libxss1 \
            libasound2t64 \
            libx11-xcb1 \
            libxcomposite1 \
            libxcursor1 \
            libxdamage1 \
            libxrandr2 \
            libxfixes3 \
            libcups2 \
            libxkbcommon0 \
            libpango-1.0-0 \
            libcairo2

      - name: Restore session cache
        uses: actions/cache@v4
        id: session-cache
        with:
          path: session
          key: whatsapp-session-${{ runner.os }}-${{ github.run_id }}
          restore-keys: |
            whatsapp-session-${{ runner.os }}-

      - name: Install Node dependencies
        run: npm install

      - name: Remove stale lock files
        run: |
          find session -name "SingletonLock" -delete 2>/dev/null || true
          find session -name "SingletonCookie" -delete 2>/dev/null || true
          find session -name "SingletonSocket" -delete 2>/dev/null || true
          find session -name "*.lock" -delete 2>/dev/null || true

      - name: Run WhatsApp bot
        env:
          PUPPETEER_EXECUTABLE_PATH: /usr/bin/google-chrome-stable
          WORKER_URL: ${{ secrets.WORKER_URL }}
          API_SECRET: ${{ secrets.API_SECRET }}
        run: npm start

      - name: Save session cache
        uses: actions/cache@v4
        if: always()
        with:
          path: session
          key: whatsapp-session-${{ runner.os }}-${{ github.run_id }}
          restore-keys: |
            whatsapp-session-${{ runner.os }}-

      - name: Commit updated files (small)
        if: always()
        run: |
          git config user.name "github-actions"
          git config user.email "github-actions@github.com"
          git add dashboard/*.json aggregate.json logs/*.log || true
          git commit -m "Update dashboard, aggregate & logs $(date +'%Y-%m-%d %H:%M')" || echo "No changes"
          git push
