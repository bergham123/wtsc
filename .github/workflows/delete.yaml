name: Send Message

on:
  workflow_dispatch:
    inputs:
      message:
        description: 'Message to send'
        required: true
        type: string
      number:
        description: 'Recipient number (with country code)'
        required: true
        type: string

jobs:
  send:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '18'

      - name: Install dependencies
        run: npm install

      - name: Install system Chromium
        run: |
          sudo apt-get update
          sudo apt-get install -y chromium-browser

      - name: Run WhatsApp bot
        env:
          WORKER_URL: ${{ secrets.WORKER_URL }}
          API_SECRET: ${{ secrets.API_SECRET }}
          # ✅ تم حذف السطر التالي لأن المتغير كان يفرض مساراً قديماً
          # PUPPETEER_EXECUTABLE_PATH: /home/runner/.cache/puppeteer/chrome
        run: node index.js "${{ github.event.inputs.message }}" "${{ github.event.inputs.number }}"
